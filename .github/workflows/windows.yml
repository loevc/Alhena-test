name: Windows checks and package

on:
  push:
    paths:
      - 'product/**'
      - 'tools/**'
      - 'tests/**'
      - 'patches/**'
      - 'build-support/**'
      - '*.ps1'
      - 'upstream.lock.json'
      - '.gitattributes'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'product/**'
      - 'tools/**'
      - 'tests/**'
      - 'patches/**'
      - 'build-support/**'
      - '*.ps1'
      - 'upstream.lock.json'
      - '.gitattributes'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
    inputs:
      build_package:
        description: Build the Windows ZIP after source checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Unit tests and actual Windows PowerShell 5.1 / PowerShell 7 parsers
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  package:
    if: github.event_name == 'workflow_dispatch' && inputs.build_package
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Package using Windows PowerShell 5.1
        shell: powershell
        run: .\build.ps1 -Action Package
      - name: Compile external desktop acceptance agents
        shell: powershell
        run: .\tools\compile-workflow-probe.ps1
      - name: Record source and archive identity
        shell: pwsh
        run: |
          $archive = Get-Item upstream/intellij-community/out/alhena/artifacts/alhena-*.win.zip
          if (@($archive).Count -ne 1) { throw 'Expected one Windows product ZIP' }
          $lock = Get-Content upstream.lock.json -Raw | ConvertFrom-Json
          [ordered]@{
            sourceCommit = '${{ github.sha }}'
            upstreamCommit = $lock.commit
            archiveName = $archive.Name
            archiveBytes = $archive.Length
            archiveSha256 = (Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            desktopAcceptance = 'not_run_on_hosted_runner'
            releaseReady = $false
          } | ConvertTo-Json | Set-Content out/reports/ci-package.json -Encoding utf8
      - name: Upload candidate package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-candidate-${{ github.sha }}
          path: |
            upstream/intellij-community/out/alhena/artifacts/alhena-*.win.zip
            out/reports/ci-package.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-build-diagnostics-${{ github.sha }}
          path: |
            out/logs/**
            out/reports/**
          if-no-files-found: ignore
          retention-days: 7
