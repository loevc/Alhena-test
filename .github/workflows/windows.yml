name: Windows checks, package and release

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'product/**'
      - 'tools/**'
      - 'tests/**'
      - 'patches/**'
      - 'build-support/**'
      - '*.ps1'
      - 'upstream.lock.json'
      - '.gitattributes'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'product/**'
      - 'tools/**'
      - 'tests/**'
      - 'patches/**'
      - 'build-support/**'
      - '*.ps1'
      - 'upstream.lock.json'
      - '.gitattributes'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
    inputs:
      build_package:
        description: Build the Windows ZIP after source checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Unit tests and actual Windows PowerShell 5.1 / PowerShell 7 parsers
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  package:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.build_package)
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Package using Windows PowerShell 5.1
        shell: powershell
        run: .\build.ps1 -Action Package
      - name: Compile external desktop acceptance agents
        shell: powershell
        run: .\tools\compile-workflow-probe.ps1
      - name: Check package, start bundled runtime and prepare release assets
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          ALHENA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $archives = @(Get-ChildItem upstream/intellij-community/out/alhena/artifacts/alhena-*.win.zip)
          if ($archives.Count -ne 1) { throw 'Expected one Windows product ZIP' }
          $arguments = @('tools/ci-release.py', 'prepare', '--archive', $archives[0].FullName, '--commit', $env:SOURCE_COMMIT)
          if ($env:RELEASE_TAG) { $arguments += @('--tag', $env:RELEASE_TAG) }
          python @arguments
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload candidate package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-candidate-${{ github.sha }}
          path: out/ci-release/*
          if-no-files-found: error
          retention-days: 7
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-build-diagnostics-${{ github.sha }}
          path: |
            out/logs/**
            out/reports/**
          if-no-files-found: ignore
          retention-days: 7

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [checks, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-candidate-${{ github.sha }}
          path: out/ci-release
      - name: Publish verified assets from this tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: python tools/ci-release.py publish --folder out/ci-release --repository "$RELEASE_REPOSITORY" --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT"
      - name: Upload publication receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-publication-${{ github.sha }}
          path: out/ci-release/published-release.json
          if-no-files-found: ignore
          retention-days: 30
